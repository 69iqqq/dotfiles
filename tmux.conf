source-file ~/.config/tmux/tmux.reset.conf
set-option -g default-terminal 'screen-256color'
set-option -g terminal-overrides ',xterm-256color:RGB'

set -g prefix ^B
set -g base-index 1              # start indexing windows at 1 instead of 0
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set -g history-limit 1000000     # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -g status-position top       # macOS / darwin style
set -g default-terminal "${TERM}"
setw -g mode-keys vi
set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'
set-option -g status-style bg=default
set -g @catppuccin_flavour 'everforest' # latte, frappe, macchiato or mocha
set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'
set-option -g default-shell /usr/bin/zsh
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
# set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
# set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'omerxx/tmux-floax'
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color 'magenta'
set -g @floax-text-color 'blue'
set -g @floax-bind 'p'
set -g @floax-change-path 'true'
set -g @sessionx-bind-zo-new-window 'ctrl-y'
set -g @sessionx-auto-accept 'off'
set -g @sessionx-custom-paths '/Users/omerxx/dotfiles'
set -g @sessionx-bind 'o'
set -g @sessionx-x-path '~/dotfiles'
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-custom-paths-subdirectories 'false'
set -g @sessionx-filter-current 'false'
set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'
bind-key a set-option status
bind-key w run-shell "tmux new-window -n wezterm 'vim /mnt/c/Users/abird/.wezterm.lua'"
set -g status on
set -g status-interval 60

# Transparent bar (depends on terminal; here we avoid background color)
set -g status-style bg=default,fg=white

# Left: Session name with rounded corner
# set -g status-left-length 50
 
set -g status-left "#[fg=blue]#[fg=black,bg=blue,bold] 69iq#[fg=blue,bg=default,nobold]"
# Right: Hide everything
set -g status-right ""

# Window title with rounded corners (centered manually)
# Unfocused window format
setw -g window-status-format " #[fg=gray]#W#{?window_zoomed_flag, ( 󰛭 󰛭 󰛭 ),} #[fg=black,bg=color3] #I#[fg=color3,bg=default]"

# Focused (current) window format
setw -g window-status-current-format " #[fg=white]#W#{?window_zoomed_flag, ( 󰛭 󰛭 󰛭 ),} #[fg=black,bg=color11] #I#[fg=color11,bg=default]"

# Optional: disable bell, reduce visual noise
set -g bell-action none
set -g visual-bell off

# Remove separators around windows
set -g window-status-separator ""

# Make tmux use UTF-8 and modern formatting

# Optional: Make panes have rounded corners (only in UI sense, can't shape panes)
set-option -g pane-border-style fg=default
set-option -g pane-active-border-style fg=green
run '~/.tmux/plugins/tpm/tpm'

bind-key w run-shell "tmux new-window -n wezterm 'vim /mnt/c/Users/abird/.wezterm.lua'"
run '~/.tmux/plugins/tpm/tpm'

